name: Refresh Vitest lockfile

on:
  push:
    branches: [fix/vitest4-aligned-coverage]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - name: Align Vitest and coverage provider
        run: pnpm add -D vitest@^4.1.11 @vitest/coverage-v8@^4.1.11 --lockfile-only
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Commit generated manifests
        shell: bash
        run: |
          git diff --check
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(deps-dev): align Vitest coverage provider"
          git push
