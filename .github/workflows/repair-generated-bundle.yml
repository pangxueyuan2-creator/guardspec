name: Repair generated action bundle

on:
  push:
    branches:
      - feat/copilot-nested-repository-scopes

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'pangxueyuan2-creator/guardspec'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/copilot-nested-repository-scopes
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.22.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm action:build
      - name: Commit generated bundle only
        shell: bash
        run: |
          if git diff --quiet -- action/dist/index.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action/dist/index.js
          git commit -m "build: refresh action bundle"
          git push origin HEAD:feat/copilot-nested-repository-scopes
