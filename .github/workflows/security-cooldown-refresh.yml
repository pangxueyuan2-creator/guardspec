name: Security cooldown refresh

on:
  push:
    branches:
      - fix/security-override-cooldown

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - name: Refresh pinned security graph
        run: pnpm install --lockfile-only
      - name: Preserve intended lockfile
        run: cp pnpm-lock.yaml /tmp/guardspec-pinned-lock.yaml
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Verify exact patched transitive pins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import YAML from 'yaml';

          const lock = YAML.parse(await readFile('pnpm-lock.yaml', 'utf8'));
          const keys = Object.keys(lock.packages ?? {});
          const expected = new Map([
            ['hono', '4.13.5'],
            ['qs', '6.16.0'],
          ]);

          for (const [name, version] of expected) {
            const versions = keys
              .filter((key) => key.startsWith(`${name}@`))
              .map((key) => key.slice(name.length + 1).split('(')[0]);
            if (versions.length === 0) throw new Error(`Missing ${name} from lockfile`);
            if (versions.some((actual) => actual !== version)) {
              throw new Error(`${name} must be pinned to ${version}; got ${versions.join(', ')}`);
            }
            console.log(`${name}: ${versions.join(', ')}`);
          }
          NODE
      - name: Reproduce Dependabot cooldown resolution
        run: pnpm update eslint@10.10.0 --lockfile-only --no-save -r --config.minimumReleaseAge=4320
      - name: Restore intended lockfile
        run: cp /tmp/guardspec-pinned-lock.yaml pnpm-lock.yaml
      - name: Recheck frozen graph
        run: pnpm install --frozen-lockfile
      - name: Quality gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm action:build
          pnpm pack:check
      - name: Commit generated lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml action/dist
          git rm .github/workflows/security-cooldown-refresh.yml
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "build(security): lock patched transitive pins"
          git push origin HEAD:fix/security-override-cooldown
